spring.application.name=fortune8keno

version=1.1
server.port=8080

# Base URL of the IRGS platform (RNG calls go to {rng-base-url}/irgs/rng).
# Override with -Dkeno.rng-base-url=https://server.domain.com or an env var
# KENO_RNGBASEURL when deploying.
keno.rng-base-url=http://localhost:8080
keno.pool-size=80
keno.draw-count=20
keno.max-picks=10

logging.level.com.keno.gameengine=INFO